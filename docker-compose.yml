services:
  shaketune:
    image: ghcr.io/beattune-core/shaketune-cli-docker:latest
    # Uncomment to build locally instead of pulling the published image:
    # build: .
    container_name: shaketune
    ports:
      - "7860:7860"
    environment:
      - SHAKETUNE_TIMEOUT=120
    restart: unless-stopped
